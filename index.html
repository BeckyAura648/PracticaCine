<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSpot - Explorador</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">
            <h1>CineSpot</h1>
        </div>
        <div class="nav-icon">
            <span class="icon-placeholder">⭐</span>
        </div>
    </header>

    <main class="main-container">
        
        <section class="search-section">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Buscar películas o series..." readonly>
            </div>
        </section>

        <section class="filters-section">
            <button class="filter-btn active">Todas</button>
            <button class="filter-btn">Películas</button>
            <button class="filter-btn">Series</button>
        </section>

        <section class="catalog-grid">
            
            <article class="movie-card">
                <div class="card-image-container">
                    <img src="img/MyMelodycute4.jpg" alt="Interstellar Poster">
                    <div class="card-overlay">
                        <span class="card-badge movie">Película</span>
                    </div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">Placeholder</h3>
                    <p class="card-genre">Ciencia ficción</p>
                </div>
            </article>

            <article class="movie-card">
                <div class="card-image-container">
                    <img src="img/MyMelodycute4.jpg" alt="Coco Poster">
                    <div class="card-overlay">
                        <span class="card-badge movie">Película</span>
                    </div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">Placeholder</h3>
                    <p class="card-genre">Animación</p>
                </div>
            </article>

            <article class="movie-card">
                <div class="card-image-container">
                    <img src="img/MyMelodycute4.jpg" alt="Stranger Things Poster">
                    <div class="card-overlay">
                        <span class="card-badge series">Serie</span>
                    </div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">Placeholder</h3>
                    <p class="card-genre">Misterio</p>
                </div>
            </article>

            <article class="movie-card">
                <div class="card-image-container">
                    <img src="img/MyMelodycute4.jpg" alt="Inception Poster">
                    <div class="card-overlay">
                        <span class="card-badge movie">Película</span>
                    </div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">Placeholder</h3>
                    <p class="card-genre">Acción / Sci-Fi</p>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
